<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thailand Lottery NK Admin</title>

<link rel="stylesheet" href="admin.css">

</head>


<body>


<div class="admin-box">


<h1>🇹🇭 Admin Panel</h1>

<p>Add New Lottery Result</p>



<input id="date" type="date" placeholder="Draw Date">


<input id="firstPrize" 
type="text" 
placeholder="1st Prize">



<input id="threeUp" 
type="text" 
placeholder="3 Up">



<input id="twoUp" 
type="text" 
placeholder="2 Up">

type="text" 
placeholder="2 Down">





<button onclick="addResult()">

ADD RESULT

</button>



<p id="message"></p>


</div>
